services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: paf-app:background-tube
    container_name: background-tube
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YOUTUBE_REGION: "${YOUTUBE_REGION:-US}"
