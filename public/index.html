<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Permissions-Policy" content="microphone=(self)">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120e16">
  <meta name="description" content="Background Heart Tube — lightweight YouTube music discovery using official APIs only.">
  <title>Background ❤️ Tube</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/ai-panel.css">
  <link rel="stylesheet" href="/css/music-extras.css">
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><i class="fa-solid fa-play"></i></div>
        <div>
          <h1>Background ❤️ Tube</h1>
          <p>Official YouTube search & embed</p>
        </div>
      </div>
      <button class="icon-btn" data-tab="settings" aria-label="Settings"><i class="fa-solid fa-sliders"></i></button>
    </header>

    <main id="mainContainer" class="viewport"></main>
  </div>

  <div id="miniPlayerBar" class="mini">
    <div class="mini-seek"><span id="miniSeekFill"></span></div>
    <div class="mini-inner">
      <div class="thumb" data-action="open-player"><img id="miniThumbnail" alt=""></div>
      <button class="ghost" data-action="open-player" style="text-align:left">
        <strong id="miniTitle">Select a track</strong>
        <div class="muted" id="miniChannel">YouTube</div>
      </button>
      <div>
        <button class="play-mini" id="miniPlayPauseBtn" data-action="toggle" aria-label="Play or pause"><i class="fa-solid fa-play"></i></button>
        <button class="ghost" data-action="stop" aria-label="Stop"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" data-tab="home"><i class="fa-solid fa-house"></i>Home</button>
    <button class="nav-btn" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
    <button class="nav-btn" data-tab="library"><i class="fa-solid fa-heart"></i>Library</button>
    <button class="nav-btn" data-tab="settings"><i class="fa-solid fa-gear"></i>Settings</button>
  </nav>

  <div id="playerOverlay" class="overlay"></div>
  <div id="sheetBack" class="modal-back"></div>
  <div id="toast" class="toast"></div>

  <!-- Single AI FAB — robot icon + unread badge (Universal AI standard) -->
  <button type="button" class="ai-fab" id="aiFab" title="AI · Feedback · Settings" aria-label="AI">
    <img src="/ai-icon.png" alt="AI" class="ai-fab-img">
    <span class="ai-fab-dot" id="aiStatusDot"></span>
    <span class="ai-badge" id="aiBadge" hidden style="display:none"></span>
  </button>

  <!-- Unified AI Panel: Chat | Feedback | Settings | Logs -->
  <div class="panel-overlay" id="aiOverlay" hidden style="z-index:400">
    <div class="panel ai-panel" id="aiPanel">
      <div class="panel-header">
        <span class="panel-title">✦ AI Music</span>
        <button type="button" class="panel-close" id="aiClose" aria-label="Close">×</button>
      </div>
      <div class="panel-tabs" id="panelTabs">
        <button type="button" class="tab active" data-tab="chat">Chat</button>
        <button type="button" class="tab" data-tab="feedback">Feedback <span class="tab-badge" id="fbTabBadge" hidden></span></button>
        <button type="button" class="tab" data-tab="settings">Settings</button>
        <button type="button" class="tab" data-tab="logs">Logs</button>
      </div>

      <div class="tab-pane active" id="tab-chat">
        <div class="panel-body" id="aiChat"></div>
        <div class="panel-footer ai-composer">
          <div class="ai-composer-row">
            <input type="text" id="aiInput" placeholder="Ask AI or speak…" autocomplete="off" enterkeyhint="send" inputmode="text">
            <button type="button" id="aiMic" class="ai-mic-btn" title="Voice command" aria-label="Voice command" aria-pressed="false">
              <i class="fa-solid fa-microphone" aria-hidden="true"></i>
            </button>
            <button type="button" id="aiSend" aria-label="Send">➤</button>
          </div>
          <div id="aiMicStatus" class="ai-mic-status" hidden></div>
        </div>
        <div class="ai-status-bar" id="aiStatusBar">AI: checking…</div>
      </div>

      <div class="tab-pane" id="tab-feedback">
        <div class="panel-body fb-body">
          <div id="fbNotices" class="fb-notices"></div>
          <div id="fbDonate" class="fb-donate" hidden></div>
          <label class="fb-label">Type</label>
          <select id="fbType">
            <option value="improvement">Improvement</option>
            <option value="bug">Bug</option>
            <option value="question">Question</option>
            <option value="playback">Playback issue</option>
            <option value="ai">AI issue</option>
            <option value="recommendation">Wrong recommendation</option>
            <option value="karaoke">Karaoke issue</option>
            <option value="remote">Remote/sync issue</option>
          </select>
          <label class="fb-label">Rating</label>
          <div class="fb-stars" id="fbStars">
            <button type="button" data-r="1">★</button>
            <button type="button" data-r="2">★</button>
            <button type="button" data-r="3">★</button>
            <button type="button" data-r="4">★</button>
            <button type="button" data-r="5">★</button>
          </div>
          <label class="fb-label">Message</label>
          <textarea id="fbMessage" rows="4" maxlength="2000" placeholder="Describe the issue or idea…"></textarea>
          <button type="button" class="fb-submit" id="fbSubmit">Send feedback</button>
          <p class="fb-status" id="fbStatus"></p>
        </div>
      </div>

      <div class="tab-pane" id="tab-settings">
        <div class="panel-body">
          <label class="fb-label">Provider</label>
          <select id="setProvider">
            <option value="none">— None —</option>
            <option value="openai">OpenAI</option>
            <option value="gemini">Google Gemini</option>
            <option value="deepseek">DeepSeek</option>
            <option value="anthropic">Anthropic</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
            <option value="mistral">Mistral</option>
            <option value="xai">xAI</option>
            <option value="custom">Custom OpenAI-compatible</option>
            <option value="local">Local OpenAI-compatible</option>
          </select>
          <label class="fb-label">API Key</label>
          <input type="password" id="setApiKey" placeholder="sk-… (not shown again after save)" autocomplete="off">
          <p class="fb-hint" id="setKeyHint">Current key: (none)</p>
          <label class="fb-label">Base URL <small>(required for Custom / Local)</small></label>
          <input type="text" id="setBaseUrl" placeholder="https://api.example.com/v1">
          <label class="fb-label">Model</label>
          <input type="text" id="setModel" placeholder="auto" value="auto">
          <label class="fb-label">Mode</label>
          <select id="setMode">
            <option value="cloud_enabled">Cloud Enabled</option>
            <option value="prefer_local">Prefer Local</option>
            <option value="local_only">Local Only</option>
            <option value="balanced">Balanced</option>
            <option value="custom">Custom</option>
          </select>
          <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <button type="button" class="fb-submit" id="setSave">Save Settings</button>
            <button type="button" class="ws-btn" id="setTest">Check token</button>
            <button type="button" class="ws-btn" id="setModels">Load models</button>
          </div>
          <p class="fb-status" id="setStatus"></p>
          <p class="fb-hint" id="setModelsHint"></p>
        </div>
      </div>

      <div class="tab-pane" id="tab-logs">
        <div class="panel-body logs-body">
          <div class="logs-toolbar">
            <button type="button" class="ws-btn" id="logsRefresh">Refresh</button>
            <button type="button" class="ws-btn" id="logsClear">Clear</button>
          </div>
          <pre id="logsView" class="logs-view">Loading…</pre>
        </div>
      </div>
    </div>
  </div>

  <div id="qrModal" class="modal-back" hidden>
    <div class="qr-card">
      <h3>QR Remote</h3>
      <p class="muted">Scan to control as Remote or join as Player. Token expires; no API keys.</p>
      <div id="qrBox" class="qr-box"></div>
      <p id="qrUrl" class="qr-url muted"></p>
      <div class="qr-actions">
        <button type="button" id="qrRemote">Remote</button>
        <button type="button" id="qrPlayer">Player</button>
        <button type="button" id="qrClose">Close</button>
      </div>
    </div>
  </div>

  <script src="/ai-module/ai-module.js"></script>
  <script src="/feedback-module/feedback-module.js"></script>
  <script src="/ai-panel.js"></script>
  <script type="module" src="/js/main.js"></script>
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
